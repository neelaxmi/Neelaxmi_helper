<!-- ============================================================
     FLOATING ROBOT ASSISTANT
     Drop this whole block right before </body> on your page.
     Requires nothing else — no external libraries.
     ============================================================ -->

<!-- ---------- 1. HTML STRUCTURE ---------- -->
<div id="robot-widget" aria-live="polite">

  <!-- Speech / "thinking cloud" bubble -->
  <div id="robot-bubble" class="robot-bubble" role="status"></div>

  <!-- Chat popup -->
  <div id="robot-chatbox" class="robot-chatbox" role="dialog" aria-label="Robot assistant chat">
    <div class="robot-chatbox-header">
      <span>What are you looking for today?</span>
      <button id="robot-close-btn" type="button" aria-label="Close chat">&times;</button>
    </div>
    <form id="robot-form" class="robot-chatbox-form">
      <input
        id="robot-input"
        type="text"
        placeholder="e.g. quiz, pyq, pdf notes..."
        autocomplete="off"
      />
      <button type="submit" id="robot-submit-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
        </svg>
      </button>
    </form>
  </div>

  <!-- The robot avatar itself -->
  <button id="robot-avatar" class="robot-avatar" type="button" aria-label="Open assistant">
    <div class="robot-float">
      <!-- Pure-CSS robot face. Swap this <div> for an <img src="robot.gif"> if you prefer an image/GIF. -->
      <div class="robot-body">
        <div class="robot-antenna"></div>
        <div class="robot-eyes">
          <span class="robot-eye"></span>
          <span class="robot-eye"></span>
        </div>
        <div class="robot-mouth"></div>
      </div>
    </div>
    <span class="robot-pulse"></span>
  </button>
</div>

<!-- ---------- 2. CSS ---------- -->
<style>
/* ===== Container: fixed bottom-right ===== */
#robot-widget{
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 9999;
  font-family: 'Inter', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

/* ===== Robot avatar button ===== */
.robot-avatar{
  position: relative;
  width: 64px;
  height: 64px;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
}

/* Floating up/down animation wrapper */
.robot-float{
  animation: robot-bob 3s ease-in-out infinite;
}
@keyframes robot-bob{
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

/* Robot body — pure CSS placeholder shape */
.robot-body{
  width: 64px;
  height: 64px;
  background: linear-gradient(160deg, #4338CA, #6366F1);
  border-radius: 20px;
  box-shadow: 0 10px 24px -8px rgba(67,56,202,0.55);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform .2s ease;
}
.robot-avatar:hover .robot-body{ transform: scale(1.06); }

.robot-antenna{
  position: absolute;
  top: -10px;
  width: 4px;
  height: 10px;
  background: #A5B4FC;
  border-radius: 2px;
}
.robot-antenna::before{
  content:'';
  position:absolute;
  top:-6px; left:50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  background:#FBBF24;
  border-radius:50%;
  box-shadow: 0 0 8px 2px rgba(251,191,36,0.8);
  animation: robot-blink-light 1.6s ease-in-out infinite;
}
@keyframes robot-blink-light{
  0%, 100% { opacity: 1; }
  50%      { opacity: .35; }
}

.robot-eyes{
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.robot-eye{
  width: 9px;
  height: 9px;
  background: #fff;
  border-radius: 50%;
  animation: robot-blink 4s infinite;
}
@keyframes robot-blink{
  0%, 92%, 100% { transform: scaleY(1); }
  95%           { transform: scaleY(0.15); }
}

.robot-mouth{
  width: 20px;
  height: 6px;
  margin-top: 6px;
  background: rgba(255,255,255,0.85);
  border-radius: 3px;
}

/* Little "online" pulse dot */
.robot-pulse{
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  background: #22C55E;
  border: 2px solid #fff;
  border-radius: 50%;
}

/* ===== Speech / thinking bubble ===== */
.robot-bubble{
  position: relative;
  max-width: 220px;
  margin-bottom: 10px;
  padding: 10px 14px;
  background: #111827;
  color: #fff;
  font-size: 13px;
  line-height: 1.4;
  border-radius: 14px;
  box-shadow: 0 8px 20px -6px rgba(0,0,0,0.35);
  opacity: 0;
  transform: translateY(8px) scale(0.96);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.robot-bubble.show{
  opacity: 1;
  transform: translateY(0) scale(1);
}
/* little tail pointing down at the robot */
.robot-bubble::after{
  content:'';
  position: absolute;
  bottom: -6px;
  right: 22px;
  width: 12px;
  height: 12px;
  background: #111827;
  transform: rotate(45deg);
  border-radius: 2px;
}

/* ===== Chat popup ===== */
.robot-chatbox{
  width: 260px;
  margin-bottom: 12px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 14px 40px -10px rgba(16,24,40,0.35);
  overflow: hidden;
  opacity: 0;
  transform: translateY(12px) scale(0.97);
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
}
.robot-chatbox.open{
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.robot-chatbox-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 14px;
  background: #4338CA;
  color: #fff;
  font-size: 13.5px;
  font-weight: 600;
}
#robot-close-btn{
  background: none;
  border: none;
  color: #fff;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  opacity: .85;
}
#robot-close-btn:hover{ opacity: 1; }

.robot-chatbox-form{
  display: flex;
  gap: 6px;
  padding: 10px;
}
#robot-input{
  flex: 1;
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid #E3E7EC;
  border-radius: 10px;
  font-size: 13.5px;
  outline: none;
}
#robot-input:focus{ border-color:#4338CA; }
#robot-submit-btn{
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 10px;
  background: #4338CA;
  color: #fff;
  cursor: pointer;
  transition: background .2s ease;
}
#robot-submit-btn:hover{ background: #3730A3; }

/* ===== MOBILE RESTRICTION ===== */
/* Fully hidden & inert below 768px — CSS handles visuals, JS (below) also
   disables logic so no listeners fire and no popups can be forced open. */
@media (max-width: 767px){
  #robot-widget{
    display: none !important;
  }
}

@media (prefers-reduced-motion: reduce){
  .robot-float, .robot-antenna::before, .robot-eye{ animation: none !important; }
}
</style>

<!-- ---------- 3. JAVASCRIPT ---------- -->
<script>
(function(){
  "use strict";

  /* ============================================================
     0. MOBILE GUARD
     If the viewport is under 768px, do not initialize anything at
     all. This is checked on load AND on resize, so rotating a
     tablet/desktop window past the breakpoint disables it live too.
     ============================================================ */
  const MOBILE_BREAKPOINT = 768;
  function isMobile(){
    return window.innerWidth < MOBILE_BREAKPOINT;
  }

  /* ============================================================
     1. CONFIG — edit this array to add/change routes.
        - id: target section selector on the page
        - keywords: accepted words/phrases (typos included) used for
          both exact substring matching and fuzzy matching
        - response: what the speech bubble says once scrolled there
     ============================================================ */
  const ROUTES = [
    {
      id: '#sec-quiz',
      keywords: ['quiz', 'quizzes', 'qiz', 'quzz', 'test', 'exam', 'mcq'],
      response: "Here's the Quiz section! Good luck! 🎯"
    },
    {
      id: '#sec-pyq',
      keywords: ['pyq', 'pyqs', 'previous year', 'previous year questions', 'past papers', 'papers'],
      response: "This is the PYQ section — previous year questions right here! 📝"
    },
    {
      id: '#sec-pdf',
      keywords: ['pdf', 'pdfs', 'notes', 'study material', 'materials', 'pdf notes'],
      response: "Found it! PDFs and study material live here. 📄"
    },
    {
      id: '#sec-courses',
      keywords: ['course', 'courses', 'crse', 'class', 'classes', 'batch', 'batches'],
      response: "Here are our Courses! Take a look. 🎓"
    },
    {
      id: '#sec-free',
      keywords: ['free', 'free stuff', 'freebies', 'fre'],
      response: "This is the Free resources section! 🆓"
    },
    {
      id: '#sec-about',
      keywords: ['about', 'about us', 'akm sir', 'teacher', 'instructor', 'who is'],
      response: "Here's more About us and the instructor! ℹ️"
    }
  ];

  /* ============================================================
     2. FUZZY MATCHING — lightweight Levenshtein distance
     ============================================================ */
  // Classic dynamic-programming edit distance between two strings.
  function levenshtein(a, b){
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;

    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;

    for (let i = 1; i <= m; i++){
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++){
        const temp = dp[j];
        dp[j] = Math.min(
          dp[j] + 1,        // deletion
          dp[j - 1] + 1,    // insertion
          prev + (a[i - 1] === b[j - 1] ? 0 : 1) // substitution
        );
        prev = temp;
      }
    }
    return dp[n];
  }

  // Given a user's typed sentence, find the best-matching route.
  // Strategy:
  //  1. Split the input into words (plus the whole phrase itself).
  //  2. For every route keyword, check for a direct substring match
  //     first (handles "how to play quiz" containing "quiz" exactly).
  //  3. If no direct match, fall back to Levenshtein distance between
  //     each input word and each keyword, allowing small typos
  //     (distance threshold scales with keyword length).
  function findBestRoute(userText){
    const text = userText.toLowerCase().trim();
    if (!text) return null;

    const words = text.split(/\s+/);

    // --- Pass 1: direct substring match (fast path, handles typo-free input) ---
    for (const route of ROUTES){
      for (const kw of route.keywords){
        if (text.includes(kw)) return route;
      }
    }

    // --- Pass 2: fuzzy match word-by-word against each keyword ---
    let best = null;
    let bestScore = Infinity;

    for (const route of ROUTES){
      for (const kw of route.keywords){
        for (const word of words){
          if (word.length < 3) continue; // skip tiny words, too noisy for fuzzy match
          const dist = levenshtein(word, kw);
          // Allow more tolerance for longer keywords (roughly 1 typo per 4 chars)
          const threshold = Math.max(1, Math.floor(kw.length / 4));
          if (dist <= threshold && dist < bestScore){
            bestScore = dist;
            best = route;
          }
        }
      }
    }

    return best;
  }

  /* ============================================================
     3. DOM REFERENCES & STATE
     ============================================================ */
  const widget   = document.getElementById('robot-widget');
  const avatar   = document.getElementById('robot-avatar');
  const chatbox  = document.getElementById('robot-chatbox');
  const closeBtn = document.getElementById('robot-close-btn');
  const form     = document.getElementById('robot-form');
  const input    = document.getElementById('robot-input');
  const bubble   = document.getElementById('robot-bubble');

  let bubbleTimer = null;
  let listenersAttached = false;

  /* ============================================================
     4. UI HELPERS
     ============================================================ */
  function openChat(){
    chatbox.classList.add('open');
    hideBubble(); // don't show both at once
    setTimeout(() => input.focus(), 150);
  }

  function closeChat(){
    chatbox.classList.remove('open');
  }

  function toggleChat(){
    chatbox.classList.contains('open') ? closeChat() : openChat();
  }

  function showBubble(text, duration = 4000){
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.classList.add('show');
    bubbleTimer = setTimeout(hideBubble, duration);
  }

  function hideBubble(){
    bubble.classList.remove('show');
  }

  /* ============================================================
     5. CORE FLOW: click -> type -> scroll -> bubble
     ============================================================ */
  function handleUserQuery(rawText){
    const route = findBestRoute(rawText);

    // Step 3: hide the chat popup immediately
    closeChat();
    input.value = '';

    if (!route){
      // No confident match — let the user know, no scroll happens.
      showBubble("Hmm, I couldn't find that. Try 'quiz', 'pyq', 'pdf', or 'courses'.", 4500);
      return;
    }

    const targetEl = document.querySelector(route.id);
    if (!targetEl){
      showBubble("That section isn't on this page right now.", 3500);
      return;
    }

    // Step 4: smooth scroll to the section
    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Step 5: show the bubble once scrolling has (roughly) finished.
    // There's no native "scrollend" callback with universal support,
    // so we detect completion by polling scroll position until it
    // stabilizes, with a safety timeout fallback.
    waitForScrollToFinish(() => {
      showBubble(route.response, 5000);
    });
  }

  // Polls window scroll position; resolves once it stops changing
  // for two consecutive checks, or after a max wait (safety net).
  function waitForScrollToFinish(callback){
    let lastY = window.scrollY;
    let stableChecks = 0;
    const maxChecks = 40;      // ~2s safety cap at 50ms interval
    let checks = 0;

    const interval = setInterval(() => {
      checks++;
      const currentY = window.scrollY;

      if (Math.abs(currentY - lastY) < 1){
        stableChecks++;
      } else {
        stableChecks = 0;
      }
      lastY = currentY;

      if (stableChecks >= 2 || checks >= maxChecks){
        clearInterval(interval);
        callback();
      }
    }, 50);
  }

  /* ============================================================
     6. EVENT LISTENERS (attached only on non-mobile)
     ============================================================ */
  function attachListeners(){
    if (listenersAttached) return;
    listenersAttached = true;

    avatar.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', closeChat);

    form.addEventListener('submit', function(e){
      e.preventDefault();
      const text = input.value;
      if (text.trim().length === 0) return;
      handleUserQuery(text);
    });

    // Close chat if user clicks outside the widget entirely
    document.addEventListener('click', function(e){
      if (!widget.contains(e.target)){
        closeChat();
      }
    });

    // Escape key closes chat
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') closeChat();
    });
  }

  function detachListeners(){
    // Cloning nodes to strip listeners would break references elsewhere,
    // so instead we just close any open UI and rely on the CSS
    // "display:none" to make the widget fully inert/unreachable.
    // (Buttons with display:none are not focusable/clickable anyway.)
    closeChat();
    hideBubble();
  }

  /* ============================================================
     7. INIT + RESPONSIVE RE-CHECK
     ============================================================ */
  function init(){
    if (isMobile()){
      detachListeners();
      return;
    }
    attachListeners();
  }

  // Re-evaluate on resize (e.g. rotating a tablet, resizing a browser
  // window across the breakpoint) — debounced for performance.
  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });

  document.addEventListener('DOMContentLoaded', init);
  // In case this script runs after DOMContentLoaded already fired:
  if (document.readyState === 'complete' || document.readyState === 'interactive'){
    init();
  }

})();
</script>

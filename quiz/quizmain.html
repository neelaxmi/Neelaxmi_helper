<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>We've Moved | NEELAXMI</title>

  <meta http-equiv="refresh" content="3;url=/quiz/quiz.html">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 42px 25px;
      border: 1px solid #252525;
      border-radius: 20px;
      background: #101010;
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .brand {
      color: #e11d2e;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    .icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(225, 29, 46, 0.12);
      color: #ff3347;
      font-size: 30px;
    }

    h1 {
      font-size: 29px;
      margin-bottom: 14px;
    }

    h1 span {
      color: #e11d2e;
    }

    .message {
      color: #aaa;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .destination {
      padding: 13px;
      margin-bottom: 25px;
      border: 1px solid #292929;
      border-radius: 10px;
      color: #ddd;
      font-size: 14px;
      background: #080808;
    }

    .destination strong {
      color: #ff3347;
    }

    .redirect-text {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .progress {
      height: 4px;
      background: #292929;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #e11d2e;
      animation: loading 3s linear forwards;
    }

    @keyframes loading {
      to { width: 100%; }
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      background: #e11d2e;
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s;
    }

    .button:hover {
      background: #bd1424;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 28px;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="/pictures/logo.png"
      alt="NEELAXMI Logo"
      class="logo"
      onerror="this.style.display='none'"
    >

    <div class="brand">NEELAXMI</div>

    <div class="icon">↗</div>

    <h1>We've <span>Moved!</span></h1>

    <p class="message">
      Our quiz platform has moved to a new page
      for a better and improved experience.
      You are being redirected to our new destination.
    </p>

    <div class="destination">
      New destination:<br>
      <strong>/quiz/quiz.html</strong>
    </div>

    <p class="redirect-text">
      Redirecting in <span id="timer">3</span> seconds...
    </p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <a href="/quiz/quiz.html" class="button">
      Continue Now →
    </a>

    <div class="footer">
      THE UNION · NEELAXMI
    </div>

  </main>

  <script>
    (function () {
      const target = "/quiz/quiz.html";
      let seconds = 3;

      console.log("[NEELAXMI Redirect] Transition page loaded successfully.");

      const timerElement = document.getElementById("timer");

      const countdown = setInterval(() => {
        seconds--;
        timerElement.textContent = seconds;

        if (seconds <= 0) {
          clearInterval(countdown);

          console.log("[NEELAXMI Redirect] Redirecting to:", target);

          window.location.replace(target);
        }
      }, 1000);

      console.log("[NEELAXMI Redirect] Countdown started successfully.");
    })();
  </script>

</body>
</html>
